name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pantry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create the test environment file
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/pantry_test
          JWT_SECRET=ci-only-secret-that-is-at-least-32-characters-long
          BCRYPT_ROUNDS=4
          CORS_ORIGINS=http://allowed.example
          RATE_LIMIT_GENERAL_MAX=10000
          RATE_LIMIT_LOGIN_MAX=5000
          RATE_LIMIT_REGISTER_MAX=1000
          EOF

      - name: Run the tests
        run: npm test

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    env:
      VITE_API_URL: https://api.example.test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build