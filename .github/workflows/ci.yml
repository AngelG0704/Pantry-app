name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pantry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create the test environment file
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/pantry_test
          JWT_SECRET=ci-only-secret-that-is-at-least-32-characters-long
          BCRYPT_ROUNDS=4
          CORS_ORIGINS=http://allowed.example
          RATE_LIMIT_GENERAL_MAX=10000
          RATE_LIMIT_LOGIN_MAX=5000
          RATE_LIMIT_REGISTER_MAX=1000
          LOG_LEVEL=silent
          EOF

      - name: Run the tests
        run: npm test

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    env:
      VITE_API_URL: https://api.example.test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pantry_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # playwright.config.js refuses to run unless this names a database called pantry_e2e.
    # It starts the API (after db:seed) and the client itself, on ports 3100 and 5174.
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pantry_e2e

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      - name: Install server, client and e2e dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client
          npm ci --prefix e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run the end-to-end tests
        run: npx playwright test
        working-directory: e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7